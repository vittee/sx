[package]
name = "sx-ssh"
version = "0.4.0"
edition = "2024"
description = "Use your own shell prompt, aliases, vim and tmux settings on any server over ssh, with nothing installed there"
license = "MIT"
repository = "https://github.com/vittee/sx"
readme = "README.md"
keywords = ["ssh", "bash", "tui", "dotfiles", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "sx"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
ctrlc = "3.5.3"
flate2 = "1.1.11"
glob = "0.3.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
